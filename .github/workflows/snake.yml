name: Generate premium contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate premium snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-snake.svg?color_snake=#7C3AED&color_dots=#EBEDF0,#C7D2FE,#A5B4FC,#818CF8,#4F46E5
            dist/contribution-snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161B22,#1E293B,#334155,#6366F1,#A78BFA

      - name: Publish snake animation
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
